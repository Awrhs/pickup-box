user  pickup pickup;
worker_processes  auto;
worker_rlimit_nofile  65535;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  10240;
    use epoll;
    multi_accept on;
}

# OS thread pool used by ngx.run_worker_thread for off-CPU (libvips) work.
# max_queue bounds the number of queued jobs; if it overflows, the Lua
# layer falls back to running vips inline so requests still complete.
thread_pool default threads=8 max_queue=64;

# Every env var read by Lua must be declared here, or nginx hides it.
env IMAGE_ACQUIRE_TIMEOUT_MS;
env IMAGE_ALLOW_ORIGINAL_FORMAT;
env IMAGE_ALLOW_QUERY_KEY;
env IMAGE_API_KEYS;
env IMAGE_API_KEY_FILE;
env IMAGE_AUDIT_LOG;
env IMAGE_CACHE_MAX_BYTES;
env IMAGE_CACHE_SECONDS;
env IMAGE_CORS_ORIGIN;
env IMAGE_DATA_DIR;
env IMAGE_DB_PATH;
env IMAGE_DEFAULT_QUOTA_BYTES;
env IMAGE_DOWNLOAD_METER;
env IMAGE_DOWNLOAD_RATE_WINDOW;
env IMAGE_DOWNLOAD_REFERER_ALLOW_EMPTY;
env IMAGE_DOWNLOAD_REFERER_LIST;
env IMAGE_DOWNLOAD_REFERER_MODE;
env IMAGE_DOWNLOAD_RPM;
env IMAGE_DOWNLOAD_SECRET;
env IMAGE_DOWNLOAD_SIGNED_URLS;
env IMAGE_DOWNLOAD_SIGN_TTL;
env IMAGE_ENABLE_PROCESSING;
env IMAGE_GC_INTERVAL;
env IMAGE_MAX_CONCURRENCY;
env IMAGE_MAX_PIXELS;
env IMAGE_MAX_UPLOAD_BYTES;
env IMAGE_METADATA_BACKEND;
env IMAGE_MIN_KEY_LENGTH;
env IMAGE_ORIGINAL_DISPOSITION;
env IMAGE_PHASH_BACKFILL;
env IMAGE_PHASH_ENABLED;
env IMAGE_PHASH_REJECT;
env IMAGE_PHASH_THRESHOLD;
env IMAGE_PREGENERATE_FORMAT;
env IMAGE_PREGENERATE_QUALITY;
env IMAGE_PREGENERATE_SIZES;
env IMAGE_QUOTA_WINDOW_DAYS;
env IMAGE_REQUIRE_STRONG_SECRET;
env IMAGE_STATS_FLUSH_INTERVAL;
env IMAGE_STORAGE_BACKEND;
env IMAGE_TEXT_FONT_DESC;
env IMAGE_TEXT_FONT_PATH;
env IMAGE_THREAD_POOL;
env IMAGE_TRUSTED_PROXY_HOPS;
env IMAGE_TUS_EXPIRY;
env IMAGE_TUS_MAX_CHUNK;
env IMAGE_UPLOAD_TITLE;
env IMAGE_VIPS_LIB;
env IMAGE_WATERMARK_IMAGE_SCALE;
env IMAGE_WATERMARK_MARGIN;
env IMAGE_WATERMARK_OPACITY;
env IMAGE_WATERMARK_PATH;
env IMAGE_WATERMARK_POSITION;
env IMAGE_WATERMARK_TEXT_SCALE;
env TRUST_X_FORWARDED_FOR;
env UPLOAD_MAX_REQUESTS;
env UPLOAD_WINDOW;

http {
    # --------------------------------------------------------------------------
    # --------------------------------------------------------------------------
    # Nginx-level rate limiting / connection caps. These complement (and do not
    # replace) the Lua-side limits: they protect against slow headers / slow
    # bodies before Lua ever runs.
    #
    # Zones are sized for a moderate fleet of distinct IPs; tune for your traffic.
    # --------------------------------------------------------------------------
    limit_req_zone  $binary_remote_addr  zone=dl_rps:10m   rate=50r/s;
    limit_req_zone  $binary_remote_addr  zone=upload_rps:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr  zone=dl_conn:10m;
    limit_conn_zone $binary_remote_addr  zone=upload_conn:10m;

    lua_package_path '/usr/local/openresty/lua/?.lua;/opt/pickup-box/lua/?.lua;;';
    lua_package_cpath '/usr/local/openresty/lualib/?.so;;';

    init_by_lua_block {
        -- Enable lua-resty-core (provides ngx.run_worker_thread, semaphore, etc.)
        require "resty.core"
        -- Validate image-hosting signing config. If IMAGE_REQUIRE_STRONG_SECRET
        -- is set, a missing/weak secret with signing enabled aborts startup.
        local sec = require "image.security"
        local sok, msgs = sec.validate_secrets()
        for _, m in ipairs(msgs) do ngx.log(ngx.WARN, "[init] ", m) end
        if not sok then
            error("image security validation failed: " .. table.concat(msgs, "; "))
        end
    }

    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;

    lua_shared_dict upload_limit 10m;
    lua_shared_dict metrics_stats 10m;
    lua_shared_dict circuit_state 1m;
    # Single-flight transform locks + L1 derivative cache.
    lua_shared_dict image_locks 1m;
    lua_shared_dict image_l1 64m;
    # Download-side rate limiting and bandwidth metering.
    lua_shared_dict image_downloads 20m;

    init_worker_by_lua_block {
        local circuit = require "common.circuit_breaker"
        circuit.init()
        -- One circuit breaker per image output format so, for example, a
        -- missing AVIF encoder doesn't take down JPEG/PNG/WebP.
        for _, fmt in ipairs({ "jpeg", "png", "webp", "gif", "avif" }) do
            circuit.register("image_" .. fmt, {
                failure_threshold     = 3,
                timeout_seconds       = 30,
                half_open_max_requests = 1,
            })
        end
        -- Probe whether each format's encoder actually works in this build.
        -- If not (e.g. libheif missing for AVIF), trip the per-format breaker
        -- immediately so requests fall back without burning retries.
        do
            local vips = require "image.vips_ffi"
            local cb = require "common.circuit_breaker"
            if vips.available() then
                for _, fmt in ipairs({ "jpeg", "png", "webp", "gif", "avif" }) do
                    local suffix = fmt == "jpeg" and ".jpg" or "." .. fmt
                    if not vips.probe_encode(suffix) then
                        ngx.log(ngx.WARN, "[image] encoder unavailable: ", fmt)
                        for _ = 1, 5 do cb.record_failure("image_" .. fmt) end
                    end
                end
                -- Register the runtime watermark font if configured.
                local config = require "image.config"
                if config.text_font_path and config.text_font_path ~= "" then
                    local ok, ferr = vips.set_font_path(config.text_font_path)
                    if not ok then
                        ngx.log(ngx.WARN, "[image] set_font_path failed: ", ferr)
                    end
                end
            end
        end
        -- Disk derivative-cache quota/LRU maintenance runs on worker 0 only.
        local cache_maint = require "image.cache_maintenance"
        cache_maint.init()
        -- Orphan/soft-delete file garbage collection, also worker 0.
        local gc = require "image.gc"
        gc.init()
        -- Per-image download stats: flush from the shared dict to SQLite.
        local stats_flush = require "image.stats_flush"
        stats_flush.init()
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time';

    # Image endpoints: strip the query string so api_key= and signed-URL
    # tokens never land in disk-backed access logs.
    log_format  img   '$remote_addr - [$time_local] "$request_method $uri" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;

    keepalive_timeout  65;
    types_hash_max_size 2048;

    server_tokens off;

    lua_code_cache on;

    lua_regex_cache_max_entries 10240;

    server {
        listen 80;
        server_name _;

        # Assign a trace_id at the very start so image requests are
        # correlated across all structured log lines.
        rewrite_by_lua_block {
            if not ngx.ctx.trace_id then
                require "common.logger".init_request()
            end
        }

        # Hard cap at the nginx layer. The Lua upload handler also enforces
        # IMAGE_MAX_UPLOAD_BYTES (default 20 MiB). Keep this a few MiB above
        # the Lua cap to leave room for multipart framing overhead; if you
        # raise IMAGE_MAX_UPLOAD_BYTES, raise this to match.
        client_max_body_size 32m;
        client_body_timeout  30s;
        client_header_timeout 10s;
        send_timeout         30s;

        location = /healthz {
            access_log off;
            content_by_lua_block {
                require("image.ops").health_check()
            }
        }

        location = /metrics {
            access_log off;
            content_by_lua_block {
                require("image.ops").metrics()
            }
        }

        location = /readyz {
            access_log off;
            content_by_lua_block {
                require("image.ops").ready_check()
            }
        }

        # Security defaults applied to every response from this server.
        # Image responses additionally get a strict img-src CSP in the /i/
        # location; HTML pages get a stricter one in their own blocks.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "no-referrer" always;
        add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

        # /upload: GET = browser form, POST = multipart upload (API key required)
        location = /upload {
            limit_req  zone=upload_rps burst=20 nodelay;
            limit_conn upload_conn 20;
            access_log /var/log/nginx/access.log img;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options        "DENY" always;
            add_header Content-Security-Policy
                "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; form-action 'self'" always;
            access_by_lua_block {
                local sec = require "image.security"
                sec.cors_headers()
                if sec.preflight() then return end
                if ngx.req.get_method() == "POST" then
                    local img = require "image.config"
                    sec.enforce_max_upload(img.max_upload_bytes)
                end
            }
            content_by_lua_block {
                local img = require "image.main"
                local method = ngx.req.get_method()
                if method == "POST" then
                    img.handle_upload()
                elseif method == "GET" or method == "HEAD" then
                    img.upload_page()
                else
                    ngx.exit(405)
                end
            }
        }

        location = /gallery {
            limit_req  zone=upload_rps burst=20 nodelay;
            access_log /var/log/nginx/access.log img;
            content_by_lua_block {
                local img = require "image.main"
                img.gallery()
            }
        }

        # Per-owner image list (self-service).
        location = /me/images {
            limit_req  zone=upload_rps burst=20 nodelay;
            access_log /var/log/nginx/access.log img;
            content_by_lua_block {
                local img = require "image.main"
                img.my_images()
            }
        }

        # Sign a path (returns a signed query string for direct links).
        location = /sign {
            limit_req  zone=upload_rps burst=20 nodelay;
            access_log /var/log/nginx/access.log img;
            content_by_lua_block {
                local img = require "image.main"
                img.sign()
            }
        }

        location = /admin/stats {
            limit_req  zone=upload_rps burst=20 nodelay;
            access_log /var/log/nginx/access.log img;
            content_by_lua_block {
                local img = require "image.main"
                img.stats()
            }
        }

        location = /admin/usage {
            limit_req  zone=upload_rps burst=20 nodelay;
            access_log /var/log/nginx/access.log img;
            content_by_lua_block {
                local img = require "image.main"
                img.usage_report()
            }
        }

        location = /admin/analytics {
            limit_req  zone=upload_rps burst=20 nodelay;
            access_log /var/log/nginx/access.log img;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy
                "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; form-action 'self'" always;
            content_by_lua_block {
                local img = require "image.main"
                img.analytics()
            }
        }

        location = /me {
            limit_req  zone=upload_rps burst=20 nodelay;
            access_log /var/log/nginx/access.log img;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy
                "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; form-action 'self'" always;
            content_by_lua_block {
                local img = require "image.main"
                img.me_page()
            }
        }

        # Image detail HTML page (/i/<hash>/view). Must be before /i/ regex.
        location ~ ^/i/[0-9a-fA-F]+/view$ {
            limit_req  zone=dl_rps burst=40 nodelay;
            access_log /var/log/nginx/access.log img;
            content_by_lua_block {
                local img = require "image.main"
                img.image_page()
            }
        }

        location = /admin {
            limit_req  zone=upload_rps burst=20 nodelay;
            access_log /var/log/nginx/access.log img;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy
                "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; form-action 'self'" always;
            content_by_lua_block {
                local img = require "image.main"
                img.admin()
            }
        }

        # Per-image info endpoint. Must be defined before the catch-all /i/
        # regex below because nginx evaluates regex locations in order.
        location ~ ^/i/[0-9a-fA-F]+/info$ {
            limit_req  zone=dl_rps burst=40 nodelay;
            access_log /var/log/nginx/access.log img;
            content_by_lua_block {
                local img = require "image.main"
                img.image_info()
            }
        }

        # tus 1.0 chunked upload protocol (P6).
        location ~ ^/files/ {
            client_max_body_size 0;
            limit_req  zone=upload_rps burst=20 nodelay;
            limit_conn upload_conn 20;
            access_log /var/log/nginx/access.log img;
            content_by_lua_block {
                local cjson = require "cjson.safe"
                local tus = require "image.tus"
                tus.dispatch()
            }
        }

        # Short URL /s/<slug> -> 302 to /i/<hash>.<ext>
        location ~ ^/s/ {
            limit_req  zone=dl_rps burst=80 nodelay;
            access_log /var/log/nginx/access.log img;
            content_by_lua_block {
                local img = require "image.main"
                img.short_redirect()
            }
        }

        # Serve images (original or transformed) and allow DELETE.
        location ~ ^/i/ {
            # Apply nginx-level burst protection in addition to the Lua
            # sliding window (download_guard). 200r/s burst=100 is generous
            # for a personal image host; tune for your workload.
            limit_req  zone=dl_rps burst=100 nodelay;
            limit_conn dl_conn 100;
            access_log /var/log/nginx/access.log img;

            # Images are inert when served with a strict image CSP and
            # nosniff; even a polyglot JPEG/HTML cannot execute as a script.
            add_header Content-Security-Policy
                "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;

            access_by_lua_block {
                local sec = require "image.security"
                sec.cors_headers()
                if sec.preflight() then return end
                local method = ngx.req.get_method()
                if method == "GET" or method == "HEAD" then
                    local guard = require "image.download_guard"
                    guard.enforce()
                end
            }
            log_by_lua_block {
                if ngx.status < 400 then
                    local guard = require "image.download_guard"
                    guard.meter(tonumber(ngx.var.body_bytes_sent) or 0)
                end
            }
            content_by_lua_block {
                local img = require "image.main"
                local method = ngx.req.get_method()
                if method == "GET" or method == "HEAD" then
                    img.serve_image()
                elseif method == "DELETE" then
                    img.delete_image()
                else
                    ngx.exit(405)
                end
            }
        }

        # Internal: stream stored files via sendfile (X-Accel-Redirect target).
        # Maps /__image_file/<rel> to /data/images/<rel>. Explicit types ensure
        # AVIF and friends get the right Content-Type (the Lua layer sets it too,
        # but the static handler overrides from extension).
        location ^~ /__image_file/ {
            internal;
            alias /data/images/;
            types {
                image/jpeg jpg jpeg;
                image/png  png;
                image/gif  gif;
                image/webp webp;
                image/avif avif;
                application/octet-stream bin;
            }
            default_type application/octet-stream;
        }

        location / {
            return 404;
        }
    }
}
