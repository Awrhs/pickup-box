# pickup-box: OpenResty configuration.
#
# The master runs as root only to bind :80 and read the server secret; worker
# processes run as the unprivileged `pickup` user that owns /data/images.
user  pickup pickup;
worker_processes  auto;
worker_rlimit_nofile  65535;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

# OS thread pool used by ngx.run_worker_thread for libvips work and file
# digests. If the queue overflows, the Lua layer runs the work inline.
thread_pool default threads=8 max_queue=64;

# Every environment variable read by Lua must be declared here, or nginx
# hides it from the Lua VM. (Generated list; keep sorted.)
#@ENV@
env IMAGE_ACQUIRE_TIMEOUT_MS;
env IMAGE_ALLOW_ORIGINAL_FORMAT;
env IMAGE_ALLOW_QUERY_KEY;
env IMAGE_API_KEYS;
env IMAGE_API_KEY_FILE;
env IMAGE_AUDIT_LOG;
env IMAGE_CACHE_MAX_BYTES;
env IMAGE_CACHE_SECONDS;
env IMAGE_CORS_ORIGIN;
env IMAGE_DATA_DIR;
env IMAGE_DB_PATH;
env IMAGE_DEFAULT_QUOTA_BYTES;
env IMAGE_DOWNLOAD_METER;
env IMAGE_DOWNLOAD_RATE_WINDOW;
env IMAGE_DOWNLOAD_REFERER_ALLOW_EMPTY;
env IMAGE_DOWNLOAD_REFERER_LIST;
env IMAGE_DOWNLOAD_REFERER_MODE;
env IMAGE_DOWNLOAD_RPM;
env IMAGE_DOWNLOAD_SECRET;
env IMAGE_DOWNLOAD_SIGNED_URLS;
env IMAGE_DOWNLOAD_SIGN_TTL;
env IMAGE_ENABLE_PROCESSING;
env IMAGE_L1_MAX_BYTES;
env IMAGE_MAX_CONCURRENCY;
env IMAGE_MAX_PIXELS;
env IMAGE_MAX_UPLOAD_BYTES;
env IMAGE_METADATA_BACKEND;
env IMAGE_MIN_KEY_LENGTH;
env IMAGE_ORIGINAL_DISPOSITION;
env IMAGE_PHASH_BACKFILL;
env IMAGE_PHASH_ENABLED;
env IMAGE_PHASH_REJECT;
env IMAGE_PHASH_THRESHOLD;
env IMAGE_PREGENERATE_FORMAT;
env IMAGE_PREGENERATE_QUALITY;
env IMAGE_PREGENERATE_SIZES;
env IMAGE_QUOTA_WINDOW_DAYS;
env IMAGE_REQUIRE_STRONG_SECRET;
env IMAGE_STORAGE_BACKEND;
env IMAGE_TEXT_FONT_DESC;
env IMAGE_TEXT_FONT_PATH;
env IMAGE_THREAD_POOL;
env IMAGE_TRUSTED_PROXY_HOPS;
env IMAGE_TUS_EXPIRY;
env IMAGE_TUS_MAX_CHUNK;
env IMAGE_UPLOAD_TITLE;
env IMAGE_VIPS_LIB;
env IMAGE_WATERMARK_IMAGE_SCALE;
env IMAGE_WATERMARK_MARGIN;
env IMAGE_WATERMARK_OPACITY;
env IMAGE_WATERMARK_PATH;
env IMAGE_WATERMARK_POSITION;
env IMAGE_WATERMARK_TEXT_SCALE;
env PICKUP_SECRET;
env TRUST_X_FORWARDED_FOR;
env UPLOAD_MAX_REQUESTS;
env UPLOAD_WINDOW;
#@END_ENV@

http {
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;

    # ---------------------------------------------------------------------
    # Request rate limits (per client IP). Exceeding returns 429 so the web
    # client can back off and retry. These complement the Lua-side limits.
    # ---------------------------------------------------------------------
    limit_req_status  429;
    limit_conn_status 429;
    limit_req_zone  $binary_remote_addr  zone=dl_rps:10m     rate=50r/s;
    limit_req_zone  $binary_remote_addr  zone=upload_rps:10m rate=20r/s;
    limit_req_zone  $binary_remote_addr  zone=api_rps:10m    rate=10r/s;
    limit_req_zone  $binary_remote_addr  zone=code_rps:10m   rate=2r/s;
    limit_conn_zone $binary_remote_addr  zone=dl_conn:10m;
    limit_conn_zone $binary_remote_addr  zone=upload_conn:10m;

    lua_package_path '/opt/pickup-box/lua/?.lua;/usr/local/openresty/lualib/?.lua;;';
    lua_package_cpath '/usr/local/openresty/lualib/?.so;;';
    lua_code_cache on;
    lua_regex_cache_max_entries 4096;

    # Cross-worker state.
    lua_shared_dict metrics_stats   10m;
    lua_shared_dict circuit_state    1m;
    lua_shared_dict upload_limit     5m;   # per-password upload throttle
    lua_shared_dict pickup_locks     2m;   # blob / tus session locks
    lua_shared_dict pickup_guard    10m;   # brute-force counters
    lua_shared_dict image_locks      1m;   # single-flight preview rendering
    lua_shared_dict image_l1        64m;   # hot preview bytes
    lua_shared_dict image_downloads 20m;   # download rate limit + metering

    init_by_lua_block {
        require("pickup.init").master()
    }

    init_worker_by_lua_block {
        require("pickup.init").worker()
    }

    log_format  main  '$remote_addr - [$time_local] "$request_method $uri" '
                      '$status $body_bytes_sent rt=$request_time "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    server {
        listen 80 default_server;
        server_name _;

        # Relative redirects stay correct behind a TLS-terminating proxy.
        absolute_redirect off;

        client_max_body_size  1m;
        client_body_buffer_size 64k;
        client_header_timeout 15s;
        client_body_timeout   60s;
        send_timeout          60s;

        rewrite_by_lua_block {
            if not ngx.ctx.trace_id then require("common.logger").init_request() end
        }

        location = / {
            limit_req zone=dl_rps burst=20 nodelay;
            content_by_lua_block { require("pickup.pages").index() }
        }

        location = /c {
            limit_req zone=code_rps burst=10 nodelay;
            content_by_lua_block { require("pickup.pages").code_lookup() }
        }

        location ~ ^/c/(\d+)$ {
            limit_req zone=code_rps burst=10 nodelay;
            content_by_lua_block { require("pickup.pages").code_lookup(ngx.var[1]) }
        }

        location = /me {
            limit_req zone=dl_rps burst=20 nodelay;
            content_by_lua_block { require("pickup.pages").me() }
        }

        # Pickup pages, files, previews, zip and QR.
        location ^~ /p/ {
            limit_req  zone=dl_rps burst=300 nodelay;
            limit_conn dl_conn 64;
            content_by_lua_block { require("pickup.pages").pickup_dispatch() }
        }

        # JSON API (multipart uploads stream through Lua, size enforced there).
        location ^~ /api/ {
            client_max_body_size 0;
            limit_req  zone=api_rps burst=60 nodelay;
            limit_conn upload_conn 20;
            content_by_lua_block { require("pickup.api").dispatch() }
        }

        # tus resumable uploads (PATCH bodies streamed by Lua).
        location ^~ /files/ {
            client_max_body_size 0;
            limit_req  zone=upload_rps burst=100 nodelay;
            limit_conn upload_conn 20;
            content_by_lua_block { require("image.tus").dispatch() }
        }

        location ^~ /static/ {
            alias /opt/pickup-box/static/;
            add_header Cache-Control "public, max-age=604800" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /favicon.ico { access_log off; return 204; }
        location = /robots.txt {
            access_log off;
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        location = /healthz {
            access_log off;
            content_by_lua_block { require("image.ops").health_check() }
        }
        location = /readyz {
            access_log off;
            content_by_lua_block { require("image.ops").ready_check() }
        }
        location = /metrics {
            access_log off;
            content_by_lua_block { require("image.ops").metrics() }
        }

        # Internal: stored files and previews, sent with sendfile and Range
        # support after a Lua handler authorised the request (ngx.exec).
        location ^~ /__blob/ {
            internal;
            alias /data/images/;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
            add_header Referrer-Policy "no-referrer" always;
            log_by_lua_block {
                if ngx.status < 400 then
                    require("image.download_guard").meter(tonumber(ngx.var.body_bytes_sent) or 0)
                end
            }
        }

        location / {
            return 404;
        }
    }
}
