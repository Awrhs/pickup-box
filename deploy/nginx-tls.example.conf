# Example nginx TLS reverse proxy in front of the OpenResty gateway.
# Copy to /etc/nginx/sites-available/i.example.com.conf and symlink to
# sites-enabled; obtain a cert with certbot --nginx.

upstream pickup_box {
    server 127.0.0.1:80;
    keepalive 32;
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name i.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name i.example.com;

    ssl_certificate     /etc/letsencrypt/live/i.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 32m;
    client_body_timeout 30s;

    # Allow large image downloads without buffering to disk.
    proxy_buffering off;
    proxy_request_buffering off;

    # Forward the real client IP. The gateway reads X-Forwarded-For only
    # when TRUST_X_FORWARDED_FOR=true (set in .env).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://pickup_box;
    }
}
