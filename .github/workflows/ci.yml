name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (syntax + luacheck + naming)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luajit + luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit lua-check
      - name: luajit -bl (syntax) for each module
        run: |
          rc=0
          while IFS= read -r f; do
            if ! luajit -bl "$f" >/dev/null; then
              echo "syntax error: $f"
              rc=1
            fi
          done < <(find lua spec -name '*.lua')
          exit $rc
      - name: luacheck
        run: luacheck lua spec
      - name: No leftover references to the old project name
        run: |
          old="ip""tv"   # split so this file does not match itself
          if grep -rniI "$old" --exclude-dir=.git . ; then
            echo "Found leftover references to the old project name"; exit 1
          fi

  unit:
    name: Unit tests (busted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "luajit-2.1.0-beta3"
      - uses: leafo/gh-actions-luarocks@v4
      - name: Install busted
        run: luarocks install busted
      - name: Run specs
        run: busted --lpath='lua/?.lua' spec/unit

  docker:
    name: Build image + nginx -t
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: pickup-box:ci
          cache-from: type=gha
          cache-to:   type=gha,mode=max
      - name: Validate nginx config inside the image
        run: docker run --rm pickup-box:ci openresty -t

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: [ docker ]
    steps:
      - uses: actions/checkout@v4
      - name: Compose up
        run: |
          cat > .env <<EOF
          IMAGE_API_KEYS=uploader:ci-upload-key-0123456789abcdef:upload,admin:ci-admin-key-0123456789abcdef:admin
          EOF
          mkdir -p logs
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -s http://127.0.0.1/readyz | tee /tmp/readyz || true
      - name: Run smoke test
        env:
          API_KEY:   ci-upload-key-0123456789abcdef
          ADMIN_KEY: ci-admin-key-0123456789abcdef
        run: |
          chmod +x tools/smoke_image.sh
          ./tools/smoke_image.sh
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=200
          cat logs/error.log 2>/dev/null | tail -200 || true
