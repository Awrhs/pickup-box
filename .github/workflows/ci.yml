name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luajit + luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit lua-check
      - name: luajit -bl (syntax) for each module
        run: |
          rc=0
          while IFS= read -r f; do
            luajit -bl "$f" >/dev/null || { echo "syntax error: $f"; rc=1; }
          done < <(find lua spec -name '*.lua')
          exit $rc
      - name: luacheck
        run: luacheck lua spec
      - name: JavaScript syntax
        run: for f in static/*.js; do node --check "$f"; done
      - name: Python syntax
        run: python3 -m py_compile tools/e2e.py tools/gen_env.py tools/browser_test.py
      - name: nginx env declarations match os.getenv() calls
        run: python3 -I tools/gen_env.py --check
      - name: No leftover references to the old project name
        run: |
          old="ip""tv"   # split so this file does not match itself
          if grep -rniI "$old" --exclude-dir=.git . ; then
            echo "Found leftover references to the old project name"; exit 1
          fi

  unit:
    name: Unit tests (busted in OpenResty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run specs inside OpenResty (resty CLI)
        run: |
          docker run --rm -v "$PWD":/w -w /w openresty/openresty:1.21.4.1-alpine-fat sh -euc '
            apk add --no-cache luarocks5.1 lua5.1-dev gcc musl-dev >/dev/null
            luarocks-5.1 install busted >/dev/null
            resty spec/run.lua spec/unit
          '

  docker:
    name: Build image + nginx -t
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: pickup-box:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate nginx config inside the image
        run: docker run --rm -e PICKUP_PASSWORD=ci-owner-password-123 pickup-box:ci openresty -t

  e2e:
    name: End-to-end (dev compose)
    runs-on: ubuntu-latest
    needs: [ docker ]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (cached)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: pickup-box:local
          cache-from: type=gha
      - name: Start
        run: |
          cat > .env <<EOF
          PICKUP_PASSWORD=ci-owner-password-123
          PICKUP_USERS=friend:ci-friend-password-123:upload:100000
          PICKUP_MAX_FILE_SIZE=50M
          PICKUP_MIN_EXPIRY=1
          EOF
          mkdir -p logs
          docker compose up -d --no-build
          for i in $(seq 1 60); do curl -sf http://127.0.0.1/readyz >/dev/null && break; sleep 1; done
          curl -s http://127.0.0.1/readyz; echo
      - name: End-to-end tests
        run: |
          python3 -I tools/e2e.py --base http://127.0.0.1 --password ci-owner-password-123 \
            --friend friend:ci-friend-password-123 --short-expiry --destructive
      - name: Metrics from inside the container
        run: docker compose exec -T pickup-box wget -qO- http://127.0.0.1/metrics | grep -q '^pickupbox_image_uploads_total'
      - name: Garbage collection (fast GC settings)
        run: |
          printf 'PICKUP_GC_INTERVAL=2\nPICKUP_UPLOAD_GRACE=1\n' >> .env
          docker compose up -d --no-build --force-recreate
          for i in $(seq 1 60); do curl -sf http://127.0.0.1/readyz >/dev/null && break; sleep 1; done
          python3 -I tools/e2e.py --base http://127.0.0.1 --password ci-owner-password-123 --only gc
      - name: Logs
        if: always()
        run: |
          docker compose ps -a
          tail -n 300 logs/error.log 2>/dev/null || docker compose logs --tail=300

  browser:
    name: Browser UI (Playwright)
    runs-on: ubuntu-latest
    needs: [ docker ]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (cached)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: pickup-box:local
          cache-from: type=gha
      - name: Start
        run: |
          echo 'PICKUP_PASSWORD=ci-browser-password-123' > .env
          mkdir -p logs
          docker compose up -d --no-build
          for i in $(seq 1 60); do curl -sf http://127.0.0.1/readyz >/dev/null && break; sleep 1; done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Browser test
        run: python tools/browser_test.py --base http://127.0.0.1 --password ci-browser-password-123 --shots browser-shots
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-shots
          path: browser-shots/
      - name: Logs
        if: always()
        run: tail -n 200 logs/error.log || true

  deploy:
    name: Production compose (Caddy + HTTPS)
    runs-on: ubuntu-latest
    needs: [ docker ]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (cached)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ghcr.io/awrhs/pickup-box:ci
          cache-from: type=gha
      - name: Install like a user would (deploy/install.sh)
        env:
          PICKUP_RAW_BASE: file://${{ github.workspace }}/deploy
          PICKUP_DIR: ${{ runner.temp }}/pb
          PICKUP_DOMAIN: localhost
          PICKUP_PASSWORD: ci-deploy-password-123
          PICKUP_VERSION: ci
        run: |
          sh deploy/install.sh
          for i in $(seq 1 90); do curl -skf https://localhost/healthz >/dev/null && break; sleep 1; done
          curl -sk https://localhost/readyz; echo
      - name: HTTP redirects to HTTPS
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = 308
      - name: End-to-end over HTTPS through Caddy
        run: python3 -I tools/e2e.py --base https://localhost --insecure --password ci-deploy-password-123
      - name: Logs
        if: always()
        working-directory: ${{ runner.temp }}/pb
        run: docker compose logs --tail=200

  publish:
    name: Publish image (ghcr.io)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ lint, unit, e2e, browser, deploy ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/awrhs/pickup-box:latest
            ghcr.io/awrhs/pickup-box:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-published:
    name: Run the published image (${{ matrix.arch }})
    needs: [ publish ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install from ghcr.io with deploy/install.sh
        env:
          PICKUP_RAW_BASE: file://${{ github.workspace }}/deploy
          PICKUP_DIR: ${{ runner.temp }}/pb
          PICKUP_DOMAIN: localhost
          PICKUP_PASSWORD: ci-published-password-123
          PICKUP_VERSION: sha-${{ github.sha }}
        run: |
          sh deploy/install.sh
          for i in $(seq 1 120); do curl -skf https://localhost/healthz >/dev/null && break; sleep 1; done
          curl -sk https://localhost/healthz; echo
      - name: End-to-end over HTTPS
        run: python3 -I tools/e2e.py --base https://localhost --insecure --password ci-published-password-123
      - name: Logs
        if: always()
        working-directory: ${{ runner.temp }}/pb
        run: docker compose logs --tail=100
