name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luajit + luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit lua-check
      - name: luajit -bl (syntax) for each module
        run: |
          rc=0
          while IFS= read -r f; do
            luajit -bl "$f" >/dev/null || { echo "syntax error: $f"; rc=1; }
          done < <(find lua spec -name '*.lua')
          exit $rc
      - name: luacheck
        run: luacheck lua spec
      - name: JavaScript syntax
        run: for f in static/*.js; do node --check "$f"; done
      - name: Python syntax
        run: python3 -m py_compile tools/e2e.py tools/gen_env.py tools/browser_test.py tools/stress.py
      - name: nginx env declarations match os.getenv() calls
        run: python3 -I tools/gen_env.py --check
      - name: No leftover references to the old project name
        run: |
          old="ip""tv"   # split so this file does not match itself
          if grep -rniI "$old" --exclude-dir=.git . ; then
            echo "Found leftover references to the old project name"; exit 1
          fi

  unit:
    name: Unit tests (busted in OpenResty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run specs inside OpenResty (resty CLI)
        run: |
          docker run --rm -v "$PWD":/w -w /w openresty/openresty:1.21.4.1-alpine-fat sh -euc '
            apk add --no-cache luarocks5.1 lua5.1-dev gcc musl-dev >/dev/null
            luarocks-5.1 install busted >/dev/null
            resty spec/run.lua spec/unit
          '

  docker:
    name: Build image + nginx -t
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: pickup-box:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate nginx config inside the image
        run: docker run --rm -e PICKUP_PASSWORD=ci-owner-password-123 pickup-box:ci openresty -t

  e2e:
    name: End-to-end (dev compose)
    runs-on: ubuntu-latest
    needs: [ docker ]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (cached)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: pickup-box:local
          cache-from: type=gha
      - name: Start
        run: |
          cat > .env <<EOF
          PICKUP_PASSWORD=ci-owner-password-123
          PICKUP_USERS=friend:ci-friend-password-123:upload:100000
          PICKUP_MAX_FILE_SIZE=50M
          PICKUP_MIN_EXPIRY=1
          EOF
          mkdir -p logs
          docker compose up -d --no-build
          for i in $(seq 1 60); do curl -sf http://127.0.0.1/readyz >/dev/null && break; sleep 1; done
          curl -s http://127.0.0.1/readyz; echo
      - name: End-to-end tests
        run: |
          python3 -I tools/e2e.py --base http://127.0.0.1 --password ci-owner-password-123 \
            --friend friend:ci-friend-password-123 --short-expiry --destructive
      - name: No worker crashes or critical errors
        run: |
          if grep -E "exited on signal|\[alert\]|\[crit\]|\[emerg\]|database is locked" logs/error.log; then
            echo "server logged crashes or critical errors"; exit 1
          fi
      - name: Metrics from inside the container
        run: |
          docker compose exec -T pickup-box wget -qO- http://127.0.0.1/metrics > metrics.txt
          for m in shares_created share_visits zip_downloads file_downloads pickup_code_failures auth_failures image_uploads; do
            grep -qE "^pickupbox_${m}_total [1-9]" metrics.txt || { echo "metric $m missing or zero"; cat metrics.txt; exit 1; }
          done
      - name: Garbage collection (fast GC settings)
        run: |
          printf 'PICKUP_GC_INTERVAL=2\nPICKUP_UPLOAD_GRACE=1\n' >> .env
          docker compose up -d --no-build --force-recreate
          for i in $(seq 1 60); do curl -sf http://127.0.0.1/readyz >/dev/null && break; sleep 1; done
          python3 -I tools/e2e.py --base http://127.0.0.1 --password ci-owner-password-123 --only gc
      - name: Logs
        if: always()
        run: |
          docker compose ps -a
          tail -n 300 logs/error.log 2>/dev/null || docker compose logs --tail=300

  browser:
    name: Browser UI (${{ matrix.engine }})
    runs-on: ubuntu-latest
    needs: [ docker ]
    strategy:
      fail-fast: false
      matrix:
        engine: [ chromium, webkit ]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (cached)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: pickup-box:local
          cache-from: type=gha
      - name: Start
        run: |
          echo 'PICKUP_PASSWORD=ci-browser-password-123' > .env
          mkdir -p logs browser-shots
          docker compose up -d --no-build
          for i in $(seq 1 60); do curl -sf http://127.0.0.1/readyz >/dev/null && break; sleep 1; done
      - name: Browser test (official Playwright image, browsers preinstalled)
        run: |
          docker run --rm --network host -v "$PWD":/w -w /w \
            mcr.microsoft.com/playwright/python:v1.48.0-noble sh -euc '
              python -m pip install -q --break-system-packages playwright==1.48.0
              python tools/browser_test.py --base http://127.0.0.1 \
                --password ci-browser-password-123 --shots browser-shots --browser ${{ matrix.engine }}
            '
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-shots-${{ matrix.engine }}
          path: browser-shots/
      - name: Logs
        if: always()
        run: tail -n 200 logs/error.log || true

  deploy:
    name: Production compose (Caddy + HTTPS)
    runs-on: ubuntu-latest
    needs: [ docker ]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (cached)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ghcr.io/awrhs/pickup-box:ci
          cache-from: type=gha
      - name: Install like a user would (deploy/install.sh)
        env:
          PICKUP_RAW_BASE: file://${{ github.workspace }}/deploy
          PICKUP_DIR: ${{ runner.temp }}/pb
          PICKUP_DOMAIN: localhost
          PICKUP_PASSWORD: ci-deploy-password-123
          PICKUP_VERSION: ci
        run: |
          sh deploy/install.sh
          for i in $(seq 1 90); do curl -skf https://localhost/healthz >/dev/null && break; sleep 1; done
          curl -sk https://localhost/readyz; echo
      - name: HTTP redirects to HTTPS
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = 308
      - name: End-to-end over HTTPS through Caddy
        run: python3 -I tools/e2e.py --base https://localhost --insecure --password ci-deploy-password-123
      - name: Real client IP behind the proxy (nginx realip)
        working-directory: ${{ runner.temp }}/pb
        run: docker compose exec -T pickup-box grep -q "real_ip_header X-Forwarded-For" /usr/local/openresty/nginx/conf/realip.conf
      - name: Concurrency stress through Caddy
        run: python3 -I tools/stress.py --base https://localhost --insecure --password ci-deploy-password-123
      - name: No worker crashes or critical errors
        working-directory: ${{ runner.temp }}/pb
        run: |
          if docker compose logs pickup-box | grep -E "exited on signal|\[alert\]|\[crit\]|\[emerg\]|database is locked"; then
            echo "server logged crashes or critical errors"; exit 1
          fi
      - name: Logs
        if: always()
        working-directory: ${{ runner.temp }}/pb
        run: docker compose logs --tail=200

  deploy-http:
    name: Production compose without a domain (HTTP)
    runs-on: ubuntu-latest
    needs: [ docker ]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (cached)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ghcr.io/awrhs/pickup-box:ci
          cache-from: type=gha
      - name: Install with an empty PICKUP_DOMAIN and no terminal
        env:
          PICKUP_RAW_BASE: file://${{ github.workspace }}/deploy
          PICKUP_DIR: ${{ runner.temp }}/pb
          PICKUP_DOMAIN: ""
          PICKUP_VERSION: ci
        run: |
          sh deploy/install.sh < /dev/null | tee install.log
          grep -q "上传密码" install.log
          for i in $(seq 1 90); do curl -sf http://localhost/healthz >/dev/null && break; sleep 1; done
      - name: End-to-end over plain HTTP through Caddy
        run: |
          pw=$(sed -n 's/^PICKUP_PASSWORD=//p' "${{ runner.temp }}/pb/.env")
          python3 -I tools/e2e.py --base http://localhost --password "$pw" --only basics,auth,uploads,shares
      - name: Logs
        if: always()
        working-directory: ${{ runner.temp }}/pb
        run: docker compose logs --tail=100

  deploy-proxy:
    name: Behind an existing Caddy / nginx (proxy mode)
    runs-on: ubuntu-latest
    needs: [ docker ]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (cached)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ghcr.io/awrhs/pickup-box:ci
          cache-from: type=gha
      - name: Existing web server on 80/443 (233boy-style Caddy with a sites/ directory)
        run: |
          mkdir -p "$RUNNER_TEMP/host-caddy/sites"
          printf '{\n  admin off\n  http_port 80\n  https_port 443\n}\nimport /etc/caddy/sites/*.conf\n' \
            > "$RUNNER_TEMP/host-caddy/Caddyfile"
          # The server already hosts a site (Caddy only listens when it has one).
          printf 'existing.localhost {\n  respond "existing site"\n}\n' \
            > "$RUNNER_TEMP/host-caddy/sites/existing.localhost.conf"
          docker run -d --name host-caddy --network host \
            -v "$RUNNER_TEMP/host-caddy:/etc/caddy" caddy:2.8.4-alpine
          for i in $(seq 1 30); do ss -ltn | grep -q ':443 ' && break; sleep 1; done
          ss -ltn | grep -q ':443 ' || { docker logs host-caddy; exit 1; }
      - name: The default installer refuses to take ports 80/443
        env:
          PICKUP_RAW_BASE: file://${{ github.workspace }}/deploy
          PICKUP_DIR: ${{ runner.temp }}/refused
          PICKUP_PASSWORD: ci-proxy-password-123
        run: |
          if sh deploy/install.sh < /dev/null > refused.log 2>&1; then cat refused.log; exit 1; fi
          grep -q "PICKUP_MODE=proxy" refused.log
      - name: Install in proxy mode
        env:
          PICKUP_RAW_BASE: file://${{ github.workspace }}/deploy
          PICKUP_DIR: ${{ runner.temp }}/pb
          PICKUP_MODE: proxy
          PICKUP_DOMAIN: localhost
          PICKUP_PASSWORD: ci-proxy-password-123
          PICKUP_VERSION: ci
        run: |
          sh deploy/install.sh < /dev/null
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:18080/healthz >/dev/null && break; sleep 1; done
          # Only reachable from the host itself.
          ss -ltn | grep ':18080 ' | grep -q '127.0.0.1:18080'
      - name: Add the generated site to the existing Caddy and restart it
        run: |
          cp "$RUNNER_TEMP/pb/caddy-site.conf" "$RUNNER_TEMP/host-caddy/sites/localhost.conf"
          docker restart host-caddy
          for i in $(seq 1 60); do curl -skf https://localhost/healthz >/dev/null && break; sleep 1; done
      - name: End-to-end through the existing Caddy
        run: |
          python3 -I tools/e2e.py --base https://localhost --insecure --password ci-proxy-password-123
          # The site that was already there keeps working.
          curl -sk --resolve existing.localhost:443:127.0.0.1 https://existing.localhost/ | grep -q "existing site"
      - name: End-to-end through nginx with the generated snippet
        run: |
          printf 'server {\n  listen 8081;\n  server_name localhost;\n  include /etc/nginx/pickup.conf;\n}\n' > nginx-server.conf
          docker run -d --name host-nginx --network host \
            -v "$PWD/nginx-server.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$RUNNER_TEMP/pb/nginx-site.conf:/etc/nginx/pickup.conf:ro" nginx:1.27-alpine
          for i in $(seq 1 30); do curl -sf http://localhost:8081/healthz >/dev/null && break; sleep 1; done
          python3 -I tools/e2e.py --base http://localhost:8081 --password ci-proxy-password-123 --only basics,uploads,shares
      - name: Logs
        if: always()
        run: |
          docker logs host-caddy 2>&1 | tail -n 30 || true
          cd "$RUNNER_TEMP/pb" && docker compose logs --tail=100 || true

  publish:
    name: Publish image (ghcr.io)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ lint, unit, e2e, browser, deploy, deploy-http, deploy-proxy ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/awrhs/pickup-box:latest
            ghcr.io/awrhs/pickup-box:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-published:
    name: Run the published image (${{ matrix.arch }})
    needs: [ publish ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install from ghcr.io with deploy/install.sh
        env:
          PICKUP_RAW_BASE: file://${{ github.workspace }}/deploy
          PICKUP_DIR: ${{ runner.temp }}/pb
          PICKUP_DOMAIN: localhost
          PICKUP_PASSWORD: ci-published-password-123
          PICKUP_VERSION: sha-${{ github.sha }}
        run: |
          sh deploy/install.sh
          for i in $(seq 1 120); do curl -skf https://localhost/healthz >/dev/null && break; sleep 1; done
          curl -sk https://localhost/healthz; echo
      - name: End-to-end over HTTPS
        run: python3 -I tools/e2e.py --base https://localhost --insecure --password ci-published-password-123
      - name: Logs
        if: always()
        working-directory: ${{ runner.temp }}/pb
        run: docker compose logs --tail=100
