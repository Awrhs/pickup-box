# Development stack: builds the image locally and bind-mounts lua/, static/
# and nginx.conf so edits apply after `docker compose exec pickup-box
# openresty -s reload`. For a public server use deploy/docker-compose.yml.
services:
  pickup-box:
    build: .
    image: pickup-box:local
    container_name: pickup-box
    ports:
      - "80:80"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./lua:/opt/pickup-box/lua:ro
      - ./static:/opt/pickup-box/static:ro
      - ./conf/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./logs:/var/log/nginx
      - pickup-data:/data
    restart: unless-stopped

volumes:
  pickup-data:
